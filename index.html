<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101719">
  <title>360° Panorama Viewer</title>
  <link rel="stylesheet" href="vendor/pannellum.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/pannellum.js"></script>
  <script defer src="panoramas.js"></script>
  <script defer src="viewer.js"></script>
</head>
<body>
  <main id="app">
    <section class="stage" aria-label="360 degree panorama">
      <div id="panorama" tabindex="0" aria-label="Panorama. Drag or use arrow keys to look around; plus and minus to zoom."></div>
      <header class="heading"><span class="badge">360°</span><div><p class="eyebrow">PANORAMA VIEWER</p><h1 id="scene-name">Your spaces, all around.</h1></div></header>
      <div class="tools" aria-label="Viewer controls">
        <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in">+</button>
        <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out">−</button>
        <button id="rotate" type="button" aria-label="Auto rotate" aria-pressed="false" title="Auto rotate">↻</button>
        <button id="fullscreen" type="button" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button>
      </div>
      <div class="pov-control" aria-label="Point of view control" hidden>
        <div class="pov-heading"><label for="pov-slider">POV</label><output id="pov-value" for="pov-slider">110°</output></div>
        <input id="pov-slider" type="range" min="40" max="160" step="1" value="110" aria-label="Adjust point of view">
        <div class="pov-scale"><span>Zoom in</span><span>Wide</span></div>
      </div>
      <div id="status" role="status" aria-live="polite">Loading panorama…</div>
      <p class="hint">Drag or swipe to explore</p>
    </section>
    <footer class="bottom-bar">
      <div class="collection"><span class="eyebrow">EXPLORE</span><span id="image-count">0 panoramas</span></div>
      <nav id="scene-list" aria-label="Choose a panorama"></nav>
      <span id="position" aria-live="polite">00 / 00</span>
    </footer>
  </main>
  <noscript>Please enable JavaScript to explore the panoramas.</noscript>
</body>
</html>
